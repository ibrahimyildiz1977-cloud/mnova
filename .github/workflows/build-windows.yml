name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MNOVA_Converter MNOVA_IR_MS_Converter_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: MNOVA_Converter_Windows_EXE
          path: dist/MNOVA_Converter.exe
